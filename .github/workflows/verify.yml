name: Verify Matlingo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - run: dart tools/check_diverse.dart
      - run: dart tools/check_depth.dart
      - run: dart tools/check_space.dart
      - run: flutter build apk --debug --no-pub
      # CI never applies schema_reset.sql or connects to the live database.
