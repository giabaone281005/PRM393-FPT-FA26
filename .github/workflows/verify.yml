name: Verify application
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter test --no-pub test/study_offline_sync_test.dart --dart-define=SUPABASE_URL=http://127.0.0.1:49477 --dart-define=SUPABASE_ANON_KEY=audit-local-key
      - run: node --test test_backend/*.test.mjs
      - run: node scripts/check-sql.mjs
      - run: flutter build apk --debug --no-pub
      # SQL scripts are run by the operator on staging; CI never accesses Cloud.
