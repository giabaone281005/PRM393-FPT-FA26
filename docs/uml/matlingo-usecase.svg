<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" role="img" aria-labelledby="title desc"><title id="title">UML Use Case Diagram — Matlingo</title><desc id="desc">User và Admin ở ngoài boundary Matlingo; 19 use case ở bên trong.</desc><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#16202b}.title{font-size:30px;font-weight:bold}.subtitle{font-size:17px;fill:#526070}.uc{font-size:20px}.id{font-size:12px;fill:#657384}.actor{font-size:24px;font-weight:bold}.note{font-size:17px}.group{font-size:18px;font-weight:bold;fill:#526070}</style><rect width="1600" height="1400" fill="white"/><text x="800" y="48" text-anchor="middle" class="title">UML USE CASE DIAGRAM</text><text x="800" y="78" text-anchor="middle" class="subtitle">Tổng quan hệ thống · Đối chiếu mã nguồn ngày 04/11/2026</text><rect x="230" y="110" width="1140" height="1110" fill="white" stroke="#16202b" stroke-width="2.5"/><text x="800" y="153" text-anchor="middle" class="title">Matlingo</text><text x="490" y="194" text-anchor="middle" class="group">CHỨC NĂNG NGƯỜI DÙNG</text><text x="1110" y="194" text-anchor="middle" class="group">CHỨC NĂNG QUẢN TRỊ</text>
